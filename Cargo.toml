[package]
name = "controller"
version = "0.11.0"
edition = "2024"
build = "build.rs"
description = "CONTROLLER, a native DualSense tuning studio"

[workspace]
members = ["protocol"]

[dependencies]
aftertouch-protocol = { path = "protocol" }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rhai = { version = "1.27.0", features = ["sync"] }
tauri = { version = "2.12.4", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-updater = "2.13.3"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
vigem-client = "0.1.4"
cpal = "0.18.2"

[build-dependencies]
tauri-build = "2.7.3"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "controller"
path = "src/main.rs"

[[bin]]
name = "aftertouch-probe"
path = "src/bin/probe.rs"
