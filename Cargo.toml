[package]
name = "aftertouch"
version = "0.3.0"
edition = "2024"
build = "build.rs"
description = "A native DualSense tuning studio"

[workspace]
members = ["protocol"]

[dependencies]
aftertouch-protocol = { path = "protocol" }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", default-features = false, features = ["wry", "common-controls-v6"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "2.7.3"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "aftertouch"
path = "src/main.rs"

[[bin]]
name = "aftertouch-probe"
path = "src/bin/probe.rs"
