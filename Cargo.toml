[package]
name = "controller"
version = "0.17.0"
edition = "2024"
autobins = false
autoexamples = false
build = "build.rs"
description = "CONTROLLER, a native DualSense tuning studio"

[workspace]
members = ["protocol"]

[dependencies]
aftertouch-protocol = { path = "protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rhai = { version = "1.27.0", features = ["sync"] }
tauri = { version = "2.12.4", default-features = false, features = ["wry", "common-controls-v6", "tray-icon"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-autostart = "2.5.1"
cpal = "0.18.2"
tauri-plugin-single-instance = "2"
arc-swap = "1.9"
crossbeam-queue = "0.3"
rubato = "0.16"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5.5", features = ["aac", "mp3", "isomp4", "alac", "flac", "ogg", "pcm", "vorbis", "wav", "aiff"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
wasapi = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
enigo = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb", "wayland", "libei_smol"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false }

[build-dependencies]
tauri-build = "2.7.3"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "controller"
path = "src/main.rs"

[[example]]
name = "aftertouch-probe"
path = "examples/probe.rs"
test = true

[[example]]
name = "audio_probe"
path = "examples/audio_probe.rs"
test = true
