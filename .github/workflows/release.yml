name: Desktop release

on:
  push:
    tags:
      - 'v*'

jobs:
  portable:
    uses: ./.github/workflows/portable-build.yml
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match tauri.conf.json version v$version" }
          if (-not $env:SIGNING_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required' }
      - name: Verify bundled ViGEmBus setup
        shell: pwsh
        run: |
          $asset = 'resources/ViGEmBus_1.22.0_x64_x86_arm64.exe'
          $expected = '89220A7865076B342892F98865F3499FB7C4CFD673159E89D352C360FD014C6A'
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne $expected) { throw 'Bundled ViGEmBus hash changed' }
          $signature = Get-AuthenticodeSignature -LiteralPath $asset
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Nefarius Software Solutions*') { throw 'Bundled ViGEmBus signature is invalid' }
      - name: Cache Tauri CLI
        uses: actions/cache@v4
        id: tauri-cli
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.11.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/install_tauri_cli.ps1
      - name: Rust tests
        run: cargo test --workspace
      - name: Cargo check
        run: cargo check --workspace
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Browser UI smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install playwright==1.64.0
          python -m playwright install chromium
          python tests/ui_smoke.py
          python tests/game_profiles_smoke.py
          python tests/game_session_smoke.py
          python tests/studio_smoke.py
          python tests/platform_smoke.py
          python tests/reliability_smoke.py
          python tests/audio_stream_smoke.py
          python tests/haptic_authoring_smoke.py
          python tests/layout_smoke.py
          python tests/motion_input_smoke.py
          python tests/daily_use_smoke.py
      - name: Build core smoke executable
        run: cargo build --bin controller
      - name: Controller-free core smoke
        run: python tests/script_smoke.py
      - name: Update manifest smoke
        run: python tests/update_manifest_smoke.py
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis --ci
      - name: Create update manifest
        shell: pwsh
        run: |
          $version = (Get-Content tauri.conf.json | ConvertFrom-Json).version
          python scripts/build_update_manifest.py $version target/release/bundle/nsis $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v4
        with:
          name: controller-Windows-release
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          if-no-files-found: error
  publish:
    needs: [release, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: controller-*
          path: release-assets
          merge-multiple: true
      - name: Publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*-setup.exe' -o -name '*.sig' -o -name latest.json -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "${#assets[@]}" -ge 6
          assets+=(resources/70-controller-dualsense.rules)
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "CONTROLLER $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
